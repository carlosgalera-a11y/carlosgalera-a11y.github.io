<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Documentos · FileHub</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="theme-color" content="#0b1326">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Hanken+Grotesk:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b1326; --card:#131b2e; --card2:#171f33; --card3:#222a3d;
    --line:#283449; --line2:#334155; --ink:#F8FAFC; --muted:#94A3B8; --soft:#64748b;
    --peri:#8083ff; --peri2:#a5a7ff; --mint:#4edea3; --mint2:#10b981; --peach:#ffb783; --rojo:#EF4444; --amber:#f59e0b;
    --input-bg:#0e1526; --radius:16px; --shadow:0 10px 26px rgba(0,0,0,.35);
    --sbw:270px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--ink);
    font-family:Inter,system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.5; overflow:hidden; }
  h1,h2,h3,.display { font-family:'Hanken Grotesk',Inter,sans-serif; }
  a { color:inherit; text-decoration:none; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#2c3852; border-radius:10px; }
  ::-webkit-scrollbar-track { background:transparent; }

  /* ═══════ GATE (contraseña) ═══════ */
  #gate { position:fixed; inset:0; z-index:500; background:radial-gradient(1200px 600px at 50% -10%,#141d38,#0b1326 60%);
    display:flex; align-items:center; justify-content:center; padding:24px; }
  #gate .box { width:100%; max-width:390px; background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:30px 26px; box-shadow:0 30px 80px rgba(0,0,0,.5); text-align:center; }
  #gate .mark { width:60px; height:60px; border-radius:18px; margin:0 auto 16px;
    background:linear-gradient(135deg,var(--peri),#c0c1ff); display:flex; align-items:center; justify-content:center;
    font-size:30px; box-shadow:0 10px 30px rgba(128,131,255,.5); }
  #gate h1 { font-size:22px; font-weight:900; margin-bottom:4px; }
  #gate .s { font-size:13px; color:var(--muted); margin-bottom:20px; }
  #gate .lock { font-size:11px; color:var(--soft); margin-top:4px; }
  #gate input { width:100%; background:var(--input-bg); border:1px solid var(--line2); color:var(--ink);
    border-radius:12px; padding:13px 14px; font-size:15px; font-family:inherit; text-align:center; letter-spacing:.02em; }
  #gate input:focus { outline:none; border-color:var(--peri); box-shadow:0 0 0 3px rgba(128,131,255,.15); }
  #gate button { width:100%; margin-top:12px; background:var(--peri); border:none; color:#fff; border-radius:12px;
    padding:13px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; }
  #gate button:disabled { opacity:.6; cursor:default; }
  #gate .err { color:var(--rojo); font-size:12.5px; font-weight:700; margin-top:12px; min-height:16px; }
  #gate .foot { font-size:11px; color:var(--soft); margin-top:18px; line-height:1.5; }

  .app { display:flex; height:100dvh; }
  /* ═══════ SIDEBAR ═══════ */
  .sidebar { width:var(--sbw); flex:none; background:linear-gradient(180deg,#0c1428,#0a1120);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    padding:16px 12px calc(12px + env(safe-area-inset-bottom)); gap:12px; }
  .brand { display:flex; align-items:center; gap:11px; padding:4px 6px 2px; }
  .brand .mark { width:42px; height:42px; border-radius:13px; flex:none;
    background:linear-gradient(135deg,var(--peri),#c0c1ff); display:flex; align-items:center; justify-content:center;
    font-size:22px; box-shadow:0 6px 18px rgba(128,131,255,.45); }
  .brand .nm { font-family:'Hanken Grotesk',sans-serif; font-weight:900; font-size:19px; letter-spacing:.02em; }
  .brand .tag { font-size:9.5px; font-weight:700; color:var(--soft); letter-spacing:.14em; text-transform:uppercase; margin-top:1px; }
  .sb-search { position:relative; }
  .sb-search input { width:100%; background:var(--input-bg); border:1px solid var(--line2); color:var(--ink);
    border-radius:11px; padding:9px 11px 9px 32px; font-size:13px; font-family:inherit; }
  .sb-search input:focus { outline:none; border-color:var(--peri); }
  .sb-search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--soft); }
  .sb-sec { font-size:10px; font-weight:800; color:var(--soft); letter-spacing:.12em; text-transform:uppercase;
    padding:2px 8px; display:flex; align-items:center; justify-content:space-between; }
  .sb-sec .badge { background:var(--card3); color:var(--muted); border-radius:20px; padding:1px 8px; font-size:10px; font-weight:700; letter-spacing:0; }
  .sb-nav { overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:2px; padding-right:2px; margin-right:-4px; }
  .navitem { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:11px; cursor:pointer;
    color:var(--muted); font-size:13.5px; font-weight:600; border:1px solid transparent; transition:.12s; }
  .navitem:hover { background:var(--card); color:var(--ink); }
  .navitem.active { color:#fff; border-color:rgba(128,131,255,.35);
    background:linear-gradient(135deg,rgba(128,131,255,.22),rgba(128,131,255,.05)); }
  .navitem .ic { font-size:16px; flex:none; width:20px; text-align:center; }
  .navitem .lbl { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .navitem .n { font-size:11px; color:var(--soft); font-weight:700; font-variant-numeric:tabular-nums; }
  .navitem.active .n { color:var(--peri2); }
  .sb-foot { display:flex; flex-direction:column; gap:2px; border-top:1px solid var(--line); padding-top:8px; }
  .sb-foot a,.sb-foot button { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:11px; cursor:pointer;
    color:var(--muted); font-size:13px; font-weight:600; background:none; border:none; font-family:inherit; text-align:left; width:100%; }
  .sb-foot a:hover,.sb-foot button:hover { background:var(--card); color:var(--ink); }

  /* ═══════ MAIN ═══════ */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line);
    background:rgba(11,19,38,.7); backdrop-filter:blur(8px); flex:none; }
  .hamb { display:none; background:var(--card2); border:1px solid var(--line2); color:var(--ink); border-radius:10px;
    width:38px; height:38px; font-size:17px; cursor:pointer; flex:none; }
  .topsearch { position:relative; flex:1; max-width:560px; }
  .topsearch input { width:100%; background:var(--input-bg); border:1px solid var(--line2); color:var(--ink);
    border-radius:12px; padding:11px 44px 11px 38px; font-size:14px; font-family:inherit; }
  .topsearch input:focus { outline:none; border-color:var(--peri); box-shadow:0 0 0 3px rgba(128,131,255,.15); }
  .topsearch svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--soft); }
  .topsearch kbd { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:10.5px; color:var(--soft);
    background:var(--card3); border:1px solid var(--line); border-radius:6px; padding:2px 6px; font-family:inherit; font-weight:700; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--card2); border:1px solid var(--line2);
    border-radius:20px; padding:6px 12px; font-size:11.5px; font-weight:700; color:var(--muted); white-space:nowrap; }
  .chip.mint { color:var(--mint); border-color:rgba(78,222,163,.3); }
  .chip .dot { width:7px; height:7px; border-radius:50%; background:var(--mint); box-shadow:0 0 8px var(--mint); }
  .user { display:inline-flex; align-items:center; gap:8px; background:var(--card2); border:1px solid var(--line2);
    border-radius:20px; padding:4px 12px 4px 5px; font-size:12.5px; font-weight:700; }
  .user .av { width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,var(--peri),var(--mint));
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; }

  .content { flex:1; overflow-y:auto; padding:22px 26px calc(40px + env(safe-area-inset-bottom)); }
  .pagehead { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .pagehead .icon { width:52px; height:52px; border-radius:15px; flex:none;
    background:linear-gradient(135deg,var(--mint),var(--mint2)); display:flex; align-items:center; justify-content:center;
    font-size:26px; box-shadow:var(--shadow); }
  .pagehead h1 { font-size:23px; font-weight:900; letter-spacing:-.01em; }
  .pagehead .sub { font-size:12.5px; color:var(--muted); margin-top:2px; }

  .statrow { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 15px; }
  .stat .v { font-size:22px; font-weight:900; font-family:'Hanken Grotesk',sans-serif; line-height:1.1; }
  .stat .k { font-size:11px; color:var(--muted); font-weight:600; margin-top:3px; }
  .stat .v.peri{color:var(--peri2)} .stat .v.mint{color:var(--mint)} .stat .v.peach{color:var(--peach)}

  .bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .crumbs { display:flex; align-items:center; gap:5px; font-size:13px; flex-wrap:wrap; flex:1; min-width:0; }
  .crumbs .c { color:var(--muted); cursor:pointer; padding:3px 8px; border-radius:8px; font-weight:600; white-space:nowrap; }
  .crumbs .c:hover { background:var(--card2); color:var(--ink); }
  .crumbs .c.cur { color:var(--ink); font-weight:800; }
  .crumbs .sep { color:var(--soft); }
  .controls { display:flex; gap:8px; align-items:center; }
  .sel { background:var(--card2); border:1px solid var(--line2); color:var(--ink); border-radius:10px;
    padding:8px 10px; font-size:12.5px; font-family:inherit; font-weight:600; cursor:pointer; }
  .viewtog { display:flex; background:var(--card2); border:1px solid var(--line2); border-radius:10px; overflow:hidden; }
  .viewtog button { background:none; border:none; color:var(--muted); padding:8px 11px; cursor:pointer; font-size:14px; }
  .viewtog button.on { background:var(--peri); color:#fff; }

  .filters { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; }
  .fchip { background:var(--card2); border:1px solid var(--line2); color:var(--muted); border-radius:20px;
    padding:6px 13px; font-size:12px; font-weight:700; cursor:pointer; transition:.12s; display:inline-flex; gap:6px; align-items:center; }
  .fchip:hover { border-color:var(--peri); color:var(--ink); }
  .fchip.on { background:rgba(128,131,255,.16); border-color:var(--peri); color:#fff; }
  .fchip .n { font-size:10.5px; color:var(--soft); font-weight:700; }
  .fchip.on .n { color:var(--peri2); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .cardf { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; cursor:pointer;
    transition:.14s; display:flex; flex-direction:column; gap:8px; position:relative; min-height:112px; }
  .cardf:hover { border-color:var(--peri); transform:translateY(-2px); box-shadow:0 12px 28px rgba(0,0,0,.4); }
  .cardf .top { display:flex; align-items:flex-start; gap:10px; }
  .cardf .em { font-size:30px; line-height:1; flex:none; }
  .cardf .folder-em { filter:drop-shadow(0 4px 8px rgba(128,131,255,.3)); }
  .cardf .nm { font-size:13.5px; font-weight:700; word-break:break-word; line-height:1.3; flex:1;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .cardf .meta { display:flex; align-items:center; gap:8px; margin-top:auto; font-size:11px; color:var(--soft); font-weight:600; }
  .cardf .ext { text-transform:uppercase; letter-spacing:.05em; background:var(--card3); border:1px solid var(--line);
    border-radius:6px; padding:1px 6px; font-size:9.5px; font-weight:800; color:var(--muted); }
  .cardf.dir { background:linear-gradient(135deg,rgba(128,131,255,.09),var(--card)); }
  .cardf .acts { display:flex; gap:6px; opacity:0; transition:.14s; position:absolute; top:10px; right:10px; }
  .cardf:hover .acts { opacity:1; }
  .cardf .acts button { width:30px; height:30px; border-radius:9px; border:1px solid var(--line2); background:var(--card3);
    color:var(--ink); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .cardf .acts button:hover { background:var(--peri); border-color:var(--peri); }

  .list { display:flex; flex-direction:column; gap:4px; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:11px; cursor:pointer;
    border:1px solid transparent; transition:.1s; }
  .row:hover { background:var(--card); border-color:var(--line); }
  .row .em { font-size:22px; flex:none; width:28px; text-align:center; }
  .row .nm { flex:1; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .path { font-size:11px; color:var(--soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:40%; }
  .row .ext { font-size:9.5px; }
  .row .sz { font-size:11.5px; color:var(--soft); font-variant-numeric:tabular-nums; width:64px; text-align:right; flex:none; }
  .row .acts { display:flex; gap:6px; flex:none; }
  .row .acts button { width:30px; height:30px; border-radius:9px; border:1px solid var(--line2); background:var(--card2);
    color:var(--muted); cursor:pointer; font-size:12px; }
  .row .acts button:hover { background:var(--peri); border-color:var(--peri); color:#fff; }

  .empty { text-align:center; color:var(--soft); padding:60px 20px; }
  .empty .big { font-size:44px; margin-bottom:10px; opacity:.6; }
  .sectitle { font-size:11px; font-weight:800; color:var(--soft); letter-spacing:.1em; text-transform:uppercase;
    margin:20px 2px 10px; display:flex; align-items:center; gap:8px; }
  .sectitle::after { content:''; flex:1; height:1px; background:var(--line); }

  .overlay { position:fixed; inset:0; background:rgba(4,8,18,.9); backdrop-filter:blur(6px); z-index:200;
    display:none; flex-direction:column; }
  .overlay.open { display:flex; }
  .ov-bar { display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--line); flex:none; }
  .ov-bar .em { font-size:20px; flex:none; }
  .ov-bar .nm { flex:1; font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ov-bar a { background:var(--card2); border:1px solid var(--line2); color:var(--ink); border-radius:10px;
    padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .ov-bar a.peri { background:var(--peri); border-color:var(--peri); }
  .ov-bar button { background:var(--card2); border:1px solid var(--line2); color:var(--ink); border-radius:10px;
    padding:8px 13px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .ov-body { flex:1; overflow:hidden; background:#0e1526; }
  .ov-body iframe { width:100%; height:100%; border:none; }
  @media (max-width:640px){ .ov-bar .hide-xs{display:none} .ov-bar .nm{font-size:12.5px} }

  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:90; display:none; }
  .scrim.open { display:block; }
  .loading { text-align:center; color:var(--muted); padding:80px 20px; font-size:14px; }
  .spin { display:inline-block; width:34px; height:34px; border:3px solid var(--line2); border-top-color:var(--peri);
    border-radius:50%; animation:sp .7s linear infinite; margin-bottom:14px; }
  @keyframes sp { to { transform:rotate(360deg); } }

  @media (max-width:960px){ .statrow{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:840px){
    .sidebar { position:fixed; z-index:100; top:0; bottom:0; left:0; transform:translateX(-104%); transition:transform .24s; }
    .sidebar.open { transform:none; box-shadow:0 0 40px rgba(0,0,0,.6); }
    .hamb { display:block; }
    .content { padding:16px 14px 40px; }
    .hide-sm { display:none !important; }
    .topbar { padding:10px 12px; }
  }
  @media (max-width:520px){ .statrow{grid-template-columns:repeat(2,1fr); gap:8px} .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px} }
</style>
</head>
<body>
<!-- ═══════ GATE ═══════ -->
<div id="gate">
  <div class="box">
    <div class="mark">🔒</div>
    <h1>Área privada</h1>
    <div class="s">Gestión Documental · EAP Riu Nord–Riu Sud</div>
    <input id="gpass" type="password" placeholder="Contraseña" autocomplete="current-password" enterkeyhint="go">
    <button id="gbtn">Entrar</button>
    <div class="err" id="gerr"></div>
    <div class="foot">🛡️ Documentación interna. No compartas el enlace ni la contraseña fuera del equipo.</div>
  </div>
</div>

<div class="scrim" id="scrim" onclick="toggleSidebar(false)"></div>
<div class="app" id="appShell" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="mark">⚡</div>
      <div><div class="nm">FILEHUB</div><div class="tag">Inteligencia de Gestión</div></div>
    </div>
    <div class="sb-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="sbFilter" placeholder="Filtrar carpetas…" autocomplete="off">
    </div>
    <div class="sb-sec">Documentos <span class="badge" id="sbBadge">—</span></div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-foot">
      <button onclick="goHome()">🏠 <span>Inicio · todas</span></button>
      <a href="/">↩︎ <span>Volver a FileHub</span></a>
      <button onclick="toggleTheme()" id="themeBtn">🌙 <span>Tema Oscuro</span></button>
      <button onclick="logout()">🔓 <span>Cerrar acceso</span></button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="hamb" onclick="toggleSidebar()">☰</button>
      <div class="topsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" placeholder="Buscar documento en todo el archivo…" autocomplete="off">
        <kbd>⌘K</kbd>
      </div>
      <span class="chip mint hide-sm" id="cloudChip"><span class="dot"></span>DRIVE</span>
      <span class="user"><span class="av">C</span><span class="hide-sm">Carlos Galera</span></span>
    </div>
    <div class="content" id="content">
      <div class="loading"><div class="spin"></div><div>Cargando archivo documental…</div></div>
    </div>
  </div>
</div>

<!-- OVERLAY PREVIEW (Google Drive) -->
<div class="overlay" id="overlay">
  <div class="ov-bar">
    <span class="em" id="ovEm"></span>
    <span class="nm" id="ovNm"></span>
    <a id="ovOpen" class="peri" target="_blank" rel="noopener">↗ Abrir en Drive</a>
    <a id="ovDl" class="hide-xs" target="_blank" rel="noopener">⬇ Descargar</a>
    <button onclick="closeOverlay()">✕</button>
  </div>
  <div class="ov-body" id="ovBody"></div>
</div>

<script>
// ═══════ Puerta de contraseña (PBKDF2-SHA256) ═══════
const GATE = { salt:"filehub-docs-santacoloma-v1", iter:200000,
  hash:"d8d01ecc32786016039e3a7548dc27d04eea28e2cf2b1e88dac843ddc9222253" };
async function pbkdf2(pw){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(GATE.salt),iterations:GATE.iter,hash:'SHA-256'},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function unlock(){ document.getElementById('gate').style.display='none';
  const sh=document.getElementById('appShell'); sh.hidden=false; if(!window.__booted){window.__booted=true; boot();} }
async function tryPass(){
  const inp=document.getElementById('gpass'), btn=document.getElementById('gbtn'), err=document.getElementById('gerr');
  const v=inp.value; if(!v) return;
  btn.disabled=true; err.textContent='Comprobando…';
  try{
    const h=await pbkdf2(v);
    if(h===GATE.hash){ try{localStorage.setItem('fh_docs_ok',h);}catch(e){} err.textContent=''; unlock(); }
    else { err.textContent='Contraseña incorrecta.'; btn.disabled=false; inp.select(); }
  }catch(e){ err.textContent='Este navegador no permite verificar (usa HTTPS).'; btn.disabled=false; }
}
(function initGate(){
  let ok=false; try{ ok=localStorage.getItem('fh_docs_ok')===GATE.hash; }catch(e){}
  if(ok){ unlock(); return; }
  document.getElementById('gbtn').addEventListener('click',tryPass);
  document.getElementById('gpass').addEventListener('keydown',e=>{ if(e.key==='Enter')tryPass(); });
  setTimeout(()=>document.getElementById('gpass').focus(),100);
})();
function logout(){ try{localStorage.removeItem('fh_docs_ok');}catch(e){} location.reload(); }

// ═══════ Enlaces a Google Drive ═══════
const drivePreview = id => `https://drive.google.com/file/d/${id}/preview`;
const driveView    = id => `https://drive.google.com/file/d/${id}/view`;
const driveDl      = id => `https://drive.google.com/uc?export=download&id=${id}`;

const TYPE_GROUPS = [
  {key:'all',   label:'Todos',       em:'📁', exts:null},
  {key:'pdf',   label:'PDF',         em:'📕', exts:['pdf']},
  {key:'word',  label:'Word',        em:'📘', exts:['doc','docx','odt','rtf','dot']},
  {key:'excel', label:'Excel',       em:'📗', exts:['xls','xlsx','csv','ods']},
  {key:'ppt',   label:'PowerPoint',  em:'📙', exts:['ppt','pptx','pot','odp']},
  {key:'img',   label:'Imágenes',    em:'🖼️', exts:['jpg','jpeg','png','gif','webp','svg','heic','bmp']},
  {key:'other', label:'Otros',       em:'📄', exts:null},
];
const KNOWN_EXTS = new Set(TYPE_GROUPS.flatMap(g=>g.exts||[]));

let IDX=null, curPath=[], view=(localStorage.getItem('fh_docs_view')||'grid'),
    sortBy=(localStorage.getItem('fh_docs_sort')||'name'), typeFilter='all', searchTerm='';

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function boot(){
  try{
    const r=await fetch('documentos-index.json?v='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    IDX=await r.json();
  }catch(e){
    document.getElementById('content').innerHTML='<div class="empty"><div class="big">📭</div><div>No se pudo cargar el índice.</div><div style="font-size:12px;margin-top:8px;color:var(--soft)">'+esc(String(e))+'</div></div>';
    return;
  }
  document.getElementById('sbBadge').textContent=IDX.total_files;
  buildNav(); applyTheme(); render();
}

function fileById(id){ return IDX.files.find(f=>f.id===id); }

function buildNav(){
  const nav=document.getElementById('sbNav'); nav.innerHTML='';
  const filter=(document.getElementById('sbFilter').value||'').toLowerCase();
  IDX.tree.dirs.filter(d=>!filter||d.name.toLowerCase().includes(filter)).forEach(d=>{
    const cat=IDX.categories.find(c=>c.name===d.name);
    const it=document.createElement('div'); it.className='navitem'; it.title=d.name;
    it.innerHTML=`<span class="ic">${cat?cat.icon:'📁'}</span><span class="lbl">${esc(d.name)}</span><span class="n">${d.count}</span>`;
    it.onclick=()=>{ searchTerm=''; document.getElementById('q').value=''; curPath=[d.name]; typeFilter='all'; render(); toggleSidebar(false); };
    if(curPath[0]===d.name && !searchTerm) it.classList.add('active');
    nav.appendChild(it);
  });
}

function nodeAt(path){ let n=IDX.tree; for(const p of path){ const d=(n.dirs||[]).find(x=>x.name===p); if(!d) return null; n=d; } return n; }
function typeOf(ext){ for(const g of TYPE_GROUPS){ if(!g.exts)continue; if(g.exts.includes(ext))return g.key; } return 'other'; }
function passType(ext){ if(typeFilter==='all')return true; if(typeFilter==='other')return !KNOWN_EXTS.has(ext); return (TYPE_GROUPS.find(g=>g.key===typeFilter).exts||[]).includes(ext); }
function sortFiles(a){ const arr=a.slice();
  if(sortBy==='name')arr.sort((x,y)=>x.name.localeCompare(y.name,'es'));
  else if(sortBy==='size')arr.sort((x,y)=>(y.size||0)-(x.size||0));
  else if(sortBy==='type')arr.sort((x,y)=>x.ext.localeCompare(y.ext)||x.name.localeCompare(y.name,'es'));
  return arr; }
function hsize(n){ if(!n)return ''; const u=['B','KB','MB','GB']; let i=0; while(n>=1024&&i<3){n/=1024;i++;} return (i?n.toFixed(1):n)+' '+u[i]; }

function render(){
  buildNav();
  const c=document.getElementById('content');
  if(searchTerm){ renderSearch(c); return; }
  const node=nodeAt(curPath)||IDX.tree;
  let dirs=(node.dirs||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'es'));
  let files=sortFiles((node.files||[]).filter(f=>passType(f.ext)));
  let h=pageHead()+statRow();
  h+=`<div class="bar"><div class="crumbs">${crumbs()}</div><div class="controls">
      <select class="sel" id="sortSel" onchange="setSort(this.value)">
        <option value="name">Nombre A→Z</option><option value="size">Tamaño</option><option value="type">Tipo</option></select>
      <div class="viewtog"><button id="vg" onclick="setView('grid')">▦</button><button id="vl" onclick="setView('list')">☰</button></div>
    </div></div>`;
  h+=filterBar(node);
  if(!dirs.length && !files.length){ h+='<div class="empty"><div class="big">🗂️</div><div>Carpeta vacía o sin resultados para este filtro.</div></div>'; }
  else {
    if(dirs.length){ h+='<div class="sectitle">Carpetas · '+dirs.length+'</div>'+renderGrid(dirs.map(d=>({dir:true,d}))); }
    if(files.length){ h+='<div class="sectitle">Archivos · '+files.length+'</div>'+(view==='grid'?renderGrid(files.map(f=>({dir:false,f}))):renderList(files)); }
  }
  c.innerHTML=h;
  document.getElementById('sortSel').value=sortBy;
  document.getElementById('vg').classList.toggle('on',view==='grid');
  document.getElementById('vl').classList.toggle('on',view==='list');
  c.scrollTop=0; bindItems();
}
function pageHead(){ const sub = curPath.length? curPath.join('  ›  ') : 'Santa Coloma · EAP Riu Nord–Riu Sud · atención primaria';
  return `<div class="pagehead"><div class="icon">🗂️</div><div><h1>Gestión Documental</h1><div class="sub">${esc(sub)}</div></div></div>`; }
function statRow(){ const node=nodeAt(curPath)||IDX.tree; const here=(node.files||[]).length;
  return `<div class="statrow">
    <div class="stat"><div class="v peri">${IDX.total_files}</div><div class="k">Documentos totales</div></div>
    <div class="stat"><div class="v mint">${IDX.total_hsize}</div><div class="k">Archivo (en Drive)</div></div>
    <div class="stat"><div class="v">${IDX.categories.length}</div><div class="k">Áreas / categorías</div></div>
    <div class="stat"><div class="v peach">${node.count||here}</div><div class="k">${curPath.length?'En esta carpeta':'Ficheros indexados'}</div></div>
  </div>`; }
function crumbs(){ let h=`<span class="c ${curPath.length?'':'cur'}" data-p="">🏠 Inicio</span>`;
  curPath.forEach((p,i)=>{ h+=`<span class="sep">›</span><span class="c ${i===curPath.length-1?'cur':''}" data-p="${i}">${esc(p)}</span>`; });
  return h; }
function filterBar(node){
  const files=(node.files||[]); const counts={}; files.forEach(f=>{ const t=typeOf(f.ext); counts[t]=(counts[t]||0)+1; });
  let h='<div class="filters">';
  TYPE_GROUPS.forEach(g=>{ let n = g.key==='all'?files.length:(counts[g.key]||0); if(g.key!=='all' && !n) return;
    h+=`<div class="fchip ${typeFilter===g.key?'on':''}" data-t="${g.key}">${g.em} ${g.label} <span class="n">${n}</span></div>`; });
  return h+'</div>';
}
function renderGrid(items){
  let h='<div class="grid">';
  items.forEach(it=>{
    if(it.dir){ const d=it.d; const cat=IDX.categories.find(c=>c.name===d.name);
      h+=`<div class="cardf dir" data-dir="${esc(d.name)}"><div class="top"><span class="em folder-em">${cat?cat.icon:'📁'}</span><div class="nm">${esc(d.name)}</div></div>
        <div class="meta"><span>${d.count} elem.</span>${d.size?'<span>·</span><span>'+hsize(d.size)+'</span>':''}</div></div>`;
    } else { const f=it.f;
      h+=`<div class="cardf file" data-id="${f.id}" data-ext="${f.ext}" data-nm="${esc(f.name)}">
        <div class="acts"><button title="Vista previa" data-act="prev">👁</button><button title="Abrir en Drive" data-act="open">↗</button></div>
        <div class="top"><span class="em">${f.icon}</span><div class="nm">${esc(f.name)}</div></div>
        <div class="meta"><span class="ext">${f.ext||'?'}</span>${f.hsize?'<span>·</span><span>'+f.hsize+'</span>':''}</div></div>`;
    }
  });
  return h+'</div>';
}
function renderList(files){
  let h='<div class="list">';
  files.forEach(f=>{
    h+=`<div class="row file" data-id="${f.id}" data-ext="${f.ext}" data-nm="${esc(f.name)}">
      <span class="em">${f.icon}</span><span class="nm">${esc(f.name)}</span>
      <span class="ext" style="font-size:9.5px">${f.ext||'?'}</span>
      <span class="sz">${f.hsize||''}</span>
      <span class="acts"><button data-act="prev" title="Vista previa">👁</button><button data-act="open" title="Abrir en Drive">↗</button></span></div>`;
  });
  return h+'</div>';
}
function renderSearch(c){
  const toks=searchTerm.toLowerCase().split(/\s+/).filter(Boolean);
  const base=IDX.files.filter(f=>{ const hay=(f.name+' '+f.dir).toLowerCase(); return toks.every(t=>hay.includes(t)); });
  let res=sortFiles(base.filter(f=>passType(f.ext))).slice(0,600);
  let h=pageHead();
  h+=`<div class="bar"><div class="crumbs"><span class="c" data-p="">🏠 Inicio</span><span class="sep">›</span><span class="c cur">🔎 «${esc(searchTerm)}» · ${res.length}${base.length>res.length?'+':''} resultado(s)</span></div>
     <div class="controls"><select class="sel" id="sortSel" onchange="setSort(this.value)"><option value="name">Nombre A→Z</option><option value="size">Tamaño</option><option value="type">Tipo</option></select>
     <div class="viewtog"><button id="vg" onclick="setView('grid')">▦</button><button id="vl" onclick="setView('list')">☰</button></div></div></div>`;
  const counts={}; base.forEach(f=>{const t=typeOf(f.ext);counts[t]=(counts[t]||0)+1;});
  h+='<div class="filters">';
  TYPE_GROUPS.forEach(g=>{ let n=g.key==='all'?base.length:(counts[g.key]||0); if(g.key!=='all'&&!n)return;
    h+=`<div class="fchip ${typeFilter===g.key?'on':''}" data-t="${g.key}">${g.em} ${g.label} <span class="n">${n}</span></div>`; });
  h+='</div>';
  if(!res.length){ h+='<div class="empty"><div class="big">🔍</div><div>Sin resultados para «'+esc(searchTerm)+'».</div></div>'; }
  else if(view==='grid'){
    h+='<div class="grid">'+res.map(f=>`<div class="cardf file" data-id="${f.id}" data-ext="${f.ext}" data-nm="${esc(f.name)}">
        <div class="acts"><button data-act="prev">👁</button><button data-act="open">↗</button></div>
        <div class="top"><span class="em">${f.icon}</span><div class="nm">${esc(f.name)}</div></div>
        <div class="meta"><span class="ext">${f.ext||'?'}</span><span>·</span><span title="${esc(f.dir)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px">${esc(f.dir.split('/').pop()||'raíz')}</span></div></div>`).join('')+'</div>';
  } else {
    h+='<div class="list">'+res.map(f=>`<div class="row file" data-id="${f.id}" data-ext="${f.ext}" data-nm="${esc(f.name)}">
        <span class="em">${f.icon}</span><span class="nm">${esc(f.name)}</span><span class="path" title="${esc(f.dir)}">${esc(f.dir)}</span>
        <span class="sz">${f.hsize||''}</span><span class="acts"><button data-act="prev">👁</button><button data-act="open">↗</button></span></div>`).join('')+'</div>';
  }
  c.innerHTML=h;
  document.getElementById('sortSel').value=sortBy;
  if(document.getElementById('vg')){document.getElementById('vg').classList.toggle('on',view==='grid');document.getElementById('vl').classList.toggle('on',view==='list');}
  bindItems(); c.scrollTop=0;
}
function bindItems(){
  document.querySelectorAll('.crumbs .c').forEach(cb=>cb.onclick=()=>{ const p=cb.dataset.p; searchTerm=''; document.getElementById('q').value='';
    if(p===''){ curPath=[]; } else { curPath=curPath.slice(0,parseInt(p)+1); } render(); });
  document.querySelectorAll('.fchip').forEach(fc=>fc.onclick=()=>{ typeFilter=fc.dataset.t; render(); });
  document.querySelectorAll('[data-dir]').forEach(d=>d.onclick=()=>{ curPath=curPath.concat([d.dataset.dir]); typeFilter='all'; render(); });
  document.querySelectorAll('.file').forEach(f=>{
    f.onclick=(e)=>{ const act=e.target.closest('[data-act]');
      if(act){ e.stopPropagation();
        if(act.dataset.act==='open') window.open(driveView(f.dataset.id),'_blank','noopener');
        else openPreview(f.dataset.id,f.dataset.ext,f.dataset.nm); }
      else openPreview(f.dataset.id,f.dataset.ext,f.dataset.nm); };
  });
}
function openPreview(id,ext,nm){
  const ov=document.getElementById('overlay'), body=document.getElementById('ovBody');
  const fm=fileById(id);
  document.getElementById('ovNm').textContent=nm;
  document.getElementById('ovEm').textContent=(fm||{}).icon||'📄';
  document.getElementById('ovOpen').href=driveView(id);
  document.getElementById('ovDl').href=driveDl(id);
  body.innerHTML=`<iframe src="${drivePreview(id)}" title="${esc(nm)}" allow="autoplay" allowfullscreen></iframe>`;
  ov.classList.add('open');
}
function closeOverlay(){ const ov=document.getElementById('overlay'); ov.classList.remove('open'); document.getElementById('ovBody').innerHTML=''; }

function setView(v){ view=v; try{localStorage.setItem('fh_docs_view',v);}catch(e){} searchTerm?renderSearch(document.getElementById('content')):render(); }
function setSort(v){ sortBy=v; try{localStorage.setItem('fh_docs_sort',v);}catch(e){} searchTerm?renderSearch(document.getElementById('content')):render(); }
function goHome(){ curPath=[]; searchTerm=''; typeFilter='all'; document.getElementById('q').value=''; render(); toggleSidebar(false); }
function toggleSidebar(force){ const sb=document.getElementById('sidebar'),sc=document.getElementById('scrim');
  const open=force===undefined?!sb.classList.contains('open'):force; sb.classList.toggle('open',open); sc.classList.toggle('open',open); }
function applyTheme(){ const light=localStorage.getItem('fh_theme')==='light'; document.documentElement.dataset.theme=light?'light':'dark';
  const b=document.getElementById('themeBtn'); if(b) b.innerHTML=light?'☀️ <span>Tema Claro</span>':'🌙 <span>Tema Oscuro</span>'; }
function toggleTheme(){ const light=localStorage.getItem('fh_theme')==='light'; try{localStorage.setItem('fh_theme',light?'dark':'light');}catch(e){} applyTheme(); }

let searchT;
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ clearTimeout(searchT); const v=e.target.value.trim();
    searchT=setTimeout(()=>{ searchTerm=v; if(v){ renderSearch(document.getElementById('content')); } else { render(); } },160); }
  if(e.target.id==='sbFilter') buildNav();
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ const q=document.getElementById('q'); if(q){e.preventDefault(); q.focus();} }
  if(e.key==='Escape'){ if(document.getElementById('overlay').classList.contains('open'))closeOverlay(); }
});
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay')closeOverlay(); });
</script>
</body>
</html>
